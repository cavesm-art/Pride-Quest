<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pride Quest: Lions Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECDA; --surface:#FFFFFF; --surface2:#F5F2E6; --ink:#2A2117; --muted:#5E5444;
  --gold:#B97A12; --gold-soft:#F4D58C; --acacia:#3F6629; --acacia-soft:#D3E2C1;
  --dusk:#423A7A; --ok:#26734A; --ok-soft:#D5EEDD; --warn:#A8402A; --warn-soft:#F7DCD3;
  --line:#CBC3A9; --sky1:#F7C873; --sky2:#E98A4C; --ground:#B89C55; --ground2:#8E7638;
  --focus:#1B5FD1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151F; --surface:#22202E; --surface2:#2B2939; --ink:#F2E9D3; --muted:#BDB39C;
    --gold:#EDB54D; --gold-soft:#5A4416; --acacia:#9CC47A; --acacia-soft:#2D3E22;
    --dusk:#B3A9F0; --ok:#71D29A; --ok-soft:#1D3B2A; --warn:#F39479; --warn-soft:#4A2419;
    --line:#3E3B4F; --sky1:#4B3C78; --sky2:#B5573A; --ground:#5B4A26; --ground2:#3E3219;
    --focus:#8DB4FF; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16151F; --surface:#22202E; --surface2:#2B2939; --ink:#F2E9D3; --muted:#BDB39C;
  --gold:#EDB54D; --gold-soft:#5A4416; --acacia:#9CC47A; --acacia-soft:#2D3E22;
  --dusk:#B3A9F0; --ok:#71D29A; --ok-soft:#1D3B2A; --warn:#F39479; --warn-soft:#4A2419;
  --line:#3E3B4F; --sky1:#4B3C78; --sky2:#B5573A; --ground:#5B4A26; --ground2:#3E3219;
  --focus:#8DB4FF; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  font-size:18px; line-height:1.55; }
h1,h2,h3,.display{ font-family:"Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; line-height:1.15; margin:0; }
strong{ font-weight:700; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }
img,svg{ max-width:100%; }
.wrap{ max-width:1180px; margin:0 auto; padding:16px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* Buttons */
.btn{ border:2px solid var(--ink); background:var(--surface); border-radius:12px; padding:10px 18px; font-weight:700; }
.btn:hover{ background:var(--surface2); }
.btn.primary{ background:var(--gold); border-color:var(--gold); color:#1d1406; }
.btn.primary:hover{ filter:brightness(1.06); }
.btn.quiet{ border-color:var(--line); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* HUD */
.hud{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:2px solid var(--line); }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:21; background:var(--surface); }
.hud .wrap{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; padding-top:10px; padding-bottom:10px; }
.hud .who{ font-weight:700; margin-right:auto; }
.hud .stat{ display:flex; align-items:baseline; gap:6px; }
.hud .stat b{ font-family:"Bricolage Grotesque", sans-serif; font-size:1.3rem; }
.hud .stat span{ color:var(--muted); font-size:.85rem; }
.rankchip{ background:var(--gold-soft); color:var(--ink); border-radius:999px; padding:3px 12px; font-weight:700; font-size:.9rem; }

/* Start */
.start{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
.start-card{ max-width:640px; width:100%; background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:28px; }
.start h1{ font-size:clamp(2.4rem, 7vw, 3.6rem); font-weight:800; letter-spacing:-.02em; }
.start .sub{ color:var(--muted); margin:6px 0 18px; }
.start ol{ padding-left:1.3em; margin:0 0 18px; }
.start ol li{ margin:4px 0; }
.field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
.field label{ font-weight:700; }
.field input, .field select{ font:inherit; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--surface2); color:var(--ink); }
.rowfields{ display:grid; grid-template-columns:2fr 1fr; gap:12px; }
.scoring{ background:var(--surface2); border-radius:12px; padding:12px 16px; margin-bottom:18px; font-size:.95rem; }
.err{ color:var(--warn); font-weight:700; min-height:1.4em; }

/* Map */
.maphead{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:12px; margin:8px 0 12px; }
.maphead h2{ font-size:clamp(1.6rem,4vw,2.3rem); font-weight:800; }
.maphead p{ margin:4px 0 0; color:var(--muted); }
.mapframe{ border-radius:20px; overflow:hidden; border:2px solid var(--line); background:var(--surface); }
.mapsvg{ display:block; width:100%; height:auto; }
.stop{ cursor:pointer; }
.stop:focus{ outline:none; }
.stop:focus-visible .ring{ stroke:var(--focus); stroke-width:6; }
.stop:hover .disc{ filter:brightness(1.08); }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; padding:12px 16px; font-size:.9rem; color:var(--muted); border-top:2px solid var(--line); }
.partlist{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:10px; margin:16px 0; }
.partbtn{ text-align:left; display:flex; gap:12px; align-items:center; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:10px 14px; }
.partbtn:hover{ border-color:var(--gold); }
.partbtn .num{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:1.4rem; width:2.2rem; height:2.2rem; border-radius:50%; display:grid; place-items:center; background:var(--surface2); flex:none; }
.partbtn.done .num{ background:var(--acacia); color:var(--surface); }
.partbtn .t{ font-weight:700; line-height:1.25; }
.partbtn .s{ font-size:.85rem; color:var(--muted); }
.mapactions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin:10px 0 30px; }

/* Zone */
.zonehead{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:8px 0 14px; }
.zonehead h2{ font-size:clamp(1.4rem,3.6vw,2rem); font-weight:800; }
.zonehead .place{ color:var(--muted); font-size:.95rem; }
.dots{ display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
.dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--surface); }
.dot.first{ background:var(--ok); border-color:var(--ok); }
.dot.second{ background:var(--gold); border-color:var(--gold); }
.dot.missed{ background:var(--warn); border-color:var(--warn); }
.dot.cur{ border-color:var(--ink); transform:scale(1.25); }
.zonegrid{ display:grid; gap:16px; grid-template-columns:1fr; align-items:start; }
@media (min-width: 940px){ .zonegrid.hasvis{ grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); } .readbox{ position:sticky; top:84px; } }
.readbox{ background:var(--surface); border:2px solid var(--line); border-left:8px solid var(--acacia); border-radius:16px; padding:16px 18px; }
.readbox h3{ font-size:1.1rem; color:var(--acacia); margin-bottom:6px; }
.readbox p{ margin:0 0 10px; }
.vis{ overflow-x:auto; }
.qcard{ background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:18px 20px 20px; }
.qmeta{ color:var(--muted); font-size:.9rem; margin-bottom:6px; }
.qread{ background:var(--acacia-soft); border-radius:10px; padding:8px 12px; margin:0 0 10px; }
.qprompt{ font-size:1.3rem; font-weight:700; margin-bottom:8px; font-family:"Atkinson Hyperlegible", sans-serif; }
.qhelp{ background:var(--surface2); border-radius:10px; padding:6px 12px; display:inline-block; margin:0 0 12px; font-size:.95rem; }
.opts{ display:grid; gap:8px; }
.opt{ text-align:left; background:var(--surface2); border:2px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; }
.opt:hover:not(:disabled){ border-color:var(--gold); }
.opt .key{ font-weight:700; flex:none; width:1.6rem; height:1.6rem; border-radius:6px; display:grid; place-items:center; background:var(--surface); border:1.5px solid var(--line); font-size:.85rem; }
.opt.wrong{ background:var(--warn-soft); border-color:var(--warn); text-decoration:line-through; text-decoration-thickness:1.5px; }
.opt.right{ background:var(--ok-soft); border-color:var(--ok); }
.opt.sel{ border-color:var(--ink); background:var(--gold-soft); }
.opt input{ width:1.2rem; height:1.2rem; margin-top:4px; accent-color:var(--gold); }
.numrow{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.numrow input{ font:inherit; font-size:1.3rem; width:11rem; padding:8px 12px; border-radius:10px; border:2px solid var(--line); background:var(--surface2); color:var(--ink); }
.numrow .unit{ font-weight:700; }
.olist{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.olist li{ display:flex; gap:10px; align-items:center; background:var(--surface2); border:2px solid var(--line); border-radius:12px; padding:8px 10px; }
.olist .pos{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; width:1.8rem; text-align:center; flex:none; color:var(--gold); font-size:1.2rem; }
.olist .txt{ flex:1; }
.olist .mv{ display:flex; flex-direction:column; gap:4px; }
.olist .mv button{ border:1.5px solid var(--line); background:var(--surface); border-radius:8px; width:2.2rem; height:1.9rem; padding:0; font-size:.9rem; }
.mtable{ display:grid; gap:8px; }
.mrow{ display:grid; grid-template-columns: minmax(8rem, 1fr) minmax(0, 1.6fr); gap:10px; align-items:center; background:var(--surface2); border-radius:12px; padding:8px 12px; border:2px solid var(--line); }
.mrow b{ line-height:1.25; }
.mrow select{ font:inherit; font-size:.95rem; padding:8px; border-radius:8px; border:2px solid var(--line); background:var(--surface); color:var(--ink); width:100%; }
@media (max-width:560px){ .mrow{ grid-template-columns:1fr; } }
.feedback{ min-height:1.5em; margin-top:14px; border-radius:12px; }
.feedback:empty{ display:none; }
.fb{ padding:12px 14px; border-radius:12px; border:2px solid; }
.fb.ok{ background:var(--ok-soft); border-color:var(--ok); }
.fb.try{ background:var(--gold-soft); border-color:var(--gold); }
.fb.no{ background:var(--warn-soft); border-color:var(--warn); }
.fb p{ margin:2px 0; }
.qactions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.conf{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); margin-top:12px; }
.conf button{ background:var(--surface2); border:2px solid var(--line); border-radius:14px; padding:14px; text-align:left; }
.conf button:hover{ border-color:var(--gold); }
.conf b{ display:block; font-size:1.1rem; }
.summary{ text-align:center; padding:26px 20px; }
.summary .stars{ font-size:2.6rem; letter-spacing:6px; }
.summary h3{ font-size:1.8rem; margin:6px 0; }
.summary ul{ text-align:left; display:inline-block; margin:8px 0 14px; }
.bank{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.bank span{ background:var(--surface2); border:1.5px solid var(--line); border-radius:999px; padding:2px 10px; font-size:.9rem; }
textarea{ width:100%; min-height:9rem; font:inherit; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--surface2); color:var(--ink); }
.checks label{ display:flex; gap:8px; align-items:flex-start; margin:4px 0; }
.checks input{ width:1.2rem; height:1.2rem; margin-top:4px; accent-color:var(--gold); }

/* Tables inside visuals */
.dtable{ border-collapse:collapse; width:100%; font-size:.95rem; min-width:420px; }
.dtable caption{ text-align:left; font-weight:700; padding-bottom:6px; }
.dtable th, .dtable td{ border:1.5px solid var(--line); padding:6px 10px; text-align:left; }
.dtable th{ background:var(--surface2); }
.dtable td.n{ text-align:right; font-variant-numeric:tabular-nums; }

.cfm{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:grid; place-items:center; padding:16px; }
.cfm-box{ background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:16px; padding:20px; max-width:440px; width:100%; }
.cfm-box p{ margin:0 0 4px; font-weight:700; }
/* Toast */
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:12px 22px; border-radius:999px; font-weight:700; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,.25); }
@media (prefers-reduced-motion: no-preference){
  .toast{ animation: pop .35s ease-out; }
  @keyframes pop{ from{ transform:translate(-50%, 20px) scale(.9); opacity:0; } to{ transform:translate(-50%,0) scale(1); opacity:1; } }
  .lion-token{ transition: transform .6s ease-in-out; }
}

/* Report */
.report{ background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:24px; margin:12px 0 30px; }
.report h2{ font-size:clamp(1.7rem,4.5vw,2.4rem); font-weight:800; }
.report h3{ font-size:1.35rem; margin:26px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--line); }
.report h4{ margin:14px 0 4px; font-size:1.05rem; }
.rgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin:16px 0; }
.rgrid div{ background:var(--surface2); border-radius:12px; padding:10px 14px; }
.rgrid b{ display:block; font-family:"Bricolage Grotesque",sans-serif; font-size:1.5rem; }
.rgrid span{ color:var(--muted); font-size:.85rem; }
.rtable{ width:100%; border-collapse:collapse; font-size:.95rem; min-width:620px; }
.rtable th, .rtable td{ border-bottom:1.5px solid var(--line); padding:8px 6px; text-align:left; vertical-align:top; }
.rtable th{ font-size:.85rem; color:var(--muted); }
.bar{ height:12px; border-radius:6px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; min-width:90px; }
.bar i{ display:block; height:100%; background:var(--acacia); }
.tag{ display:inline-block; border-radius:999px; padding:1px 10px; font-weight:700; font-size:.85rem; white-space:nowrap; }
.tag.strong{ background:var(--ok-soft); color:var(--ok); }
.tag.almost{ background:var(--gold-soft); color:var(--ink); }
.tag.review{ background:var(--warn-soft); color:var(--warn); }
.tag.none{ background:var(--surface2); color:var(--muted); }
.item{ border-left:5px solid var(--warn); background:var(--surface2); border-radius:0 12px 12px 0; padding:10px 14px; margin:10px 0; }
.item.almost{ border-left-color:var(--gold); }
.item.good{ border-left-color:var(--ok); }
.item p{ margin:3px 0; }
.item .lbl{ font-weight:700; }
.small{ font-size:.9rem; color:var(--muted); }
.writing{ white-space:pre-wrap; background:var(--surface2); border-radius:12px; padding:12px; }
.ractions{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 0; }
.scrollx{ overflow-x:auto; }
@media print{
  .hud, .ractions, .noprint, .toast{ display:none !important; }
  body{ background:#fff; color:#000; font-size:12pt; }
  .report{ border:none; padding:0; }
  .item, .rgrid div{ break-inside:avoid; }
}
</style>
</head>

var ZONES = DATA.zones, SKILLS = DATA.skills, TAGS = DATA.tags;
var KEY = "pridequest-lions-2026";
var app = document.getElementById("app");

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function range(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }
function zrec(z){ if(!S.zones[z.id]) S.zones[z.id] = { conf:null, q:{}, pts:0, writing:null }; return S.zones[z.id]; }
function scorable(z){ return z.questions.filter(function(q){ return q.type!=="write"; }); }
function touch(){ var now=Date.now(); if(S.lastAct){ S.activeMs += Math.min(now - S.lastAct, 120000); } S.lastAct = now; }
function fmtNum(n){ return Number(n).toLocaleString("en-US", {maximumFractionDigits:4}); }
function maxPoints(){ var n=0; ZONES.forEach(function(z){ n += scorable(z).length; }); return n*10; }
var RANKS = [
  { at:0,   name:"Cub" },
  { at:.20, name:"Young Lion" },
  { at:.45, name:"Hunter" },
  { at:.70, name:"Pride Leader" },
  { at:.90, name:"Lion of the Savanna" }
];
function rank(){ var f = S.points / maxPoints(), r = RANKS[0]; RANKS.forEach(function(x){ if(f >= x.at) r = x; }); return r.name; }
function askConfirm(msg, yes, onYes){
  var old = document.getElementById("cfm"); if(old) old.remove();
  var back = document.activeElement;
  var d = document.createElement("div"); d.id = "cfm"; d.className = "cfm";
  d.innerHTML = '<div class="cfm-box" role="dialog" aria-modal="true" aria-labelledby="cfmt"><p id="cfmt">' + esc(msg) + '</p><div class="qactions"><button class="btn primary" id="cfy">' + esc(yes) + '</button><button class="btn quiet" id="cfn">Cancel</button></div></div>';
  document.body.appendChild(d);
  var close = function(){ d.remove(); if(back && back.focus && document.body.contains(back)) back.focus(); };
  document.getElementById("cfn").onclick = close;
  document.getElementById("cfy").onclick = function(){ d.remove(); onYes(); };
  d.addEventListener("keydown", function(e){ if(e.key==="Escape") close(); });
  d.addEventListener("click", function(e){ if(e.target === d) close(); });
  document.getElementById("cfn").focus();
}
function toast(msg){ Array.prototype.forEach.call(document.querySelectorAll(".toast"), function(o){ o.remove(); }); var t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }

function zoneStats(z){
  var rec = zrec(z), qs = scorable(z), first=0, second=0, missed=0, answered=0;
  qs.forEach(function(q){ var r = rec.q[q.id]; if(!r || !r.result) return; answered++;
    if(r.result==="first") first++; else if(r.result==="second") second++; else missed++; });
  var denom = answered || 1;
  return { first:first, second:second, missed:missed, answered:answered, total:qs.length,
           done: answered===qs.length, score:(first + .5*second)/denom };
}
function stars(st){ if(!st.done) return 0; return st.score >= .85 ? 3 : st.score >= .6 ? 2 : 1; }
function status(score){ return score >= .85 ? "strong" : score >= .6 ? "almost" : "review"; }
var STATUS_TXT = { strong:"Strong", almost:"Getting there", review:"Review this", none:"Not started" };

/* ---------- HUD ---------- */
function hud(){
  var done = ZONES.filter(function(z){ return zoneStats(z).done; }).length;
  return '<header class="hud"><div class="wrap">' +
    '<div class="who">🦁 ' + esc(S.name) + ' <span class="small">Block ' + esc(S.hour) + '</span></div>' +
    '<div class="stat"><b>' + S.points + '</b><span>points</span></div>' +
    '<div class="stat"><b>' + (S.streak ? "🐾".repeat(Math.min(S.streak,5)) : "–") + '</b><span>streak</span></div>' +
    '<div class="stat"><b>' + done + '/10</b><span>parts</span></div>' +
    '<span class="rankchip">' + rank() + '</span>' +
    '</div></header>';
}

/* ---------- START ---------- */
function renderStart(){
  var saved = load();
  var resume = "";
  if(saved && saved.name){
    resume = '<div class="scoring"><p style="margin:0 0 8px"><strong>Welcome back, ' + esc(saved.name) + '.</strong> Your progress is saved on this computer.</p>' +
      '<div class="qactions" style="margin:0"><button class="btn primary" id="resume">Keep going</button><button class="btn quiet" id="fresh">I am a different student</button></div></div>';
  }
  var hours = ""; for(var h=1; h<=4; h++){ hours += '<option>' + h + 'A</option><option>' + h + 'B</option>'; }
  app.innerHTML = '<main class="start"><div class="start-card">' +
    '<h1 class="display">Pride Quest</h1>' +
    '<p class="sub">Lions unit review. Travel the savanna. Reach Pride Rock.</p>' + resume +
    '<h2 style="font-size:1.2rem;margin-bottom:6px">How to play</h2>' +
    '<ol><li>Type your name and pick your hour.</li>' +
    '<li>Pick a part on the map. Each part matches a part of your <strong>Review Guide</strong>.</li>' +
    '<li>Read the <strong>Read box</strong> first. Then answer each question.</li>' +
    '<li>You get 2 tries. Questions with only 2 choices get 1 try.</li>' +
    '<li>The game will not show you answers. It gives hints.</li>' +
    '<li>Finish all 10 parts. Then open your report.</li></ol>' +
    '<div class="scoring"><strong>Points:</strong> 10 on the first try. 5 on the second try. 3 first-try answers in a row = <strong>+5 Roar bonus</strong>.</div>' +
    '<div id="sf"><div class="rowfields"><div class="field"><label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="40"></div>' +
    '<div class="field"><label for="hr">Block</label><select id="hr"><option value="">Pick</option>' + hours + '</select></div></div>' +
    '<p class="err" id="er" role="alert"></p>' +
    '<button class="btn primary" type="button" id="go">Start my quest</button></div>' +
    '</div></main>';
  if(saved && saved.name){
    document.getElementById("resume").onclick = function(){ S = saved; renderMap(); };
    document.getElementById("fresh").onclick = function(){ askConfirm("Start a new quest? The saved progress for " + saved.name + " will be cleared from this computer.", "Yes, start new", function(){ try{ localStorage.removeItem(KEY); }catch(e){} renderStart(); }); };
  }
  var startGame = function(){
    var n = document.getElementById("nm").value.trim(), h = document.getElementById("hr").value;
    if(!n){ document.getElementById("er").textContent = "Type your name to start."; return; }
    if(!h){ document.getElementById("er").textContent = "Pick your block to start."; return; }
    S = { name:n, hour:h, start:Date.now(), activeMs:0, lastAct:Date.now(), points:0, streak:0, best:0, zones:{}, last:null };
    save(); renderMap();
  };
  document.getElementById("go").onclick = startGame;
  document.getElementById("nm").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); startGame(); } });
}

    '<div class="partlist">' + list + '</div>' +
    '<div class="mapactions"><button class="btn quiet noprint" id="restart">Start over</button>' +
    '<button class="btn primary" id="rep">' + (done === 10 ? "See my report" : "See my report (" + done + "/10 done)") + '</button></div>' +
    '</main>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-z]"), function(el){
    var go = function(){ openZone(+el.getAttribute("data-z")); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); go(); } });
  });
  document.getElementById("rep").onclick = function(){
    if(done < 10){ askConfirm("You finished " + done + " of 10 parts. Your report will only cover what you did. Open it anyway?", "Open my report", renderReport); return; }
    renderReport();
  };
  document.getElementById("restart").onclick = function(){
    askConfirm("Start over? All points and answers will be erased.", "Yes, start over", function(){ try{ localStorage.removeItem(KEY); }catch(e){} S=null; renderStart(); });
  };
}
function acacia(x,y,s){
  return '<g transform="translate('+x+' '+y+') scale('+s+')" fill="var(--ground2)" opacity=".9"><rect x="-3" y="-48" width="6" height="48"/>' +
    '<path d="M-3 -40 L-22 -60 M3 -40 L20 -62" stroke="var(--ground2)" stroke-width="4"/>' +
    '<ellipse cx="0" cy="-66" rx="52" ry="12"/></g>';
}

/* ---------- ZONE ---------- */
function openZone(i){
  var z = ZONES[i]; ui.zone = i; S.last = i; ui.temp = {};
  var rec = zrec(z);
  if(!rec.conf){ renderConf(z); return; }
  var qi = z.questions.findIndex(function(q){ var r = rec.q[q.id]; return !(r && (r.result || r.saved)); });
  if(qi === -1){ renderZoneSummary(z); return; }
  ui.q = qi; renderQuestion(z);
}
function zoneHead(z){
  var rec = zrec(z);
  var dots = z.questions.map(function(q, i){
    var r = rec.q[q.id], c = r && r.result ? r.result : (r && r.saved ? "first" : "");
    return '<span class="dot ' + c + (i===ui.q && ui.mode==="q" ? " cur" : "") + '" title="Question ' + (i+1) + '"></span>';
  }).join("");
  return '<div class="zonehead"><button class="btn quiet" id="tomap">← Map</button><div><h2>Part ' + z.part + ': ' + esc(z.title) + '</h2><div class="place">' + z.icon + ' ' + esc(z.place) + '</div></div><div class="dots" aria-hidden="true">' + dots + '</div></div>';
}
function bindMap(){ var b=document.getElementById("tomap"); if(b) b.onclick = function(){ save(); renderMap(); }; }
function renderConf(z){
  ui.mode = "conf";
  app.innerHTML = hud() + '<main class="wrap">' + zoneHead(z) +
    '<section class="qcard"><h3 class="qprompt">Before you start</h3><p>How sure do you feel about <strong>' + esc(z.title) + '</strong> right now?</p>' +
    '<div class="conf"><button data-c="1"><b>1: Not yet</b>I need to learn this.</button><button data-c="2"><b>2: Getting there</b>I know some of it.</button><button data-c="3"><b>3: Got it</b>I can do this.</button></div>' +
    '<p class="small" style="margin-top:12px">This does not change your points. Your report compares it to how you did.</p></section></main>';
  bindMap();
  Array.prototype.forEach.call(document.querySelectorAll("[data-c]"), function(b){
    b.onclick = function(){ zrec(z).conf = +b.getAttribute("data-c"); save(); openZone(ui.zone); };
  });
}

function maxTries(q){ return (q.type==="mc" && q.options.length<=2) ? 1 : 2; }

function renderQuestion(z){
  ui.mode = "q";
  var q = z.questions[ui.q], rec = zrec(z), r = rec.q[q.id] || (rec.q[q.id] = { tries:0, wrong:[], tags:[] });
  var vis = z.visual ? VIS[z.visual]() : "";
  var read = '<section class="readbox" aria-label="Read box"><h3>📖 Read</h3><p>' + md(z.read) + '</p>' + (vis ? '<div class="vis">' + vis + '</div>' : "") + '</section>';
  var nScore = scorable(z).length, idx = scorable(z).indexOf(q);
  var meta = q.type==="write" ? "Writing practice (not scored)" : ("Question " + (idx+1) + " of " + nScore + (maxTries(q)===1 ? " · 1 try" : " · 2 tries"));
  var body = "";
  if(q.type==="mc") body = mcBody(q);
  else if(q.type==="multi") body = multiBody(q);
  else if(q.type==="num") body = numBody(q);
  else if(q.type==="order") body = orderBody(q);
  else if(q.type==="match") body = matchBody(q);
  else if(q.type==="write") body = writeBody(z, q);
  var card = '<section class="qcard" aria-labelledby="qp">' +
    '<div class="qmeta">' + meta + '</div>' +
    (q.read ? '<p class="qread">' + md(q.read) + '</p>' : "") +
    '<h3 class="qprompt" id="qp">' + md(q.prompt) + '</h3>' +
    (q.help ? '<p class="qhelp">🧮 ' + md(q.help) + '</p>' : "") +
    '<div id="qb">' + body + '</div>' +
    '<div class="feedback" id="fb" aria-live="polite"></div>' +
    '<div class="qactions">' + (q.type!=="mc" && q.type!=="write" ? '<button class="btn primary" id="chk">Check</button>' : "") +
    '<button class="btn primary" id="nxt" hidden>Next →</button></div></section>';
  app.innerHTML = hud() + '<main class="wrap">' + zoneHead(z) + '<div class="zonegrid' + (vis ? " hasvis" : "") + '">' + read + card + '</div></main>';
  bindMap();
  wire(z, q, r);
  var first = document.querySelector("#qb button, #qb input, #qb select, #qb textarea");
  if(first && document.activeElement === document.body) first.focus({preventScroll:true});
}

/* ----- bodies ----- */
function getOrder(q, n){ if(!ui.temp[q.id]) ui.temp[q.id] = q.fixed ? range(n) : shuffle(range(n)); return ui.temp[q.id]; }
function mcBody(q){
  var ord = getOrder(q, q.options.length);
  return '<div class="opts" role="group" aria-label="Choices">' + ord.map(function(oi, k){
    return '<button class="opt" data-o="' + oi + '"><span class="key">' + "ABCDEF"[k] + '</span><span>' + md(q.options[oi]) + '</span></button>';
  }).join("") + '</div>';
}
function multiBody(q){
  var ord = getOrder(q, q.options.length);
  return '<div class="opts" role="group" aria-label="Check all that apply">' + ord.map(function(oi){
    return '<label class="opt"><input type="checkbox" value="' + oi + '"><span>' + md(q.options[oi]) + '</span></label>';
  }).join("") + '</div>';
}
function numBody(q){
  return '<div class="numrow"><label class="sr" for="ni">Your answer</label><input id="ni" inputmode="decimal" autocomplete="off" placeholder="Type a number"><span class="unit">' + esc(q.unit || "") + '</span></div>' +
    '<p class="small">Use a calculator. Type the number only. The unit is shown for you.</p>';
}
function orderBody(q){
  if(!ui.temp[q.id]){
    var o; do { o = shuffle(range(q.items.length)); } while(isOrderRight(q, o));
    ui.temp[q.id] = o;
  }
  var o2 = ui.temp[q.id];
  return '<p class="small" style="margin-top:0">Use ▲ and ▼ to move each step.</p><ol class="olist">' + o2.map(function(ii, k){
    return '<li><span class="pos">' + (k+1) + '</span><span class="txt">' + md(q.items[ii]) + '</span><span class="mv">' +
      '<button data-up="' + k + '" aria-label="Move up: ' + esc(q.items[ii]) + '"' + (k===0?" disabled":"") + '>▲</button>' +
      '<button data-dn="' + k + '" aria-label="Move down: ' + esc(q.items[ii]) + '"' + (k===o2.length-1?" disabled":"") + '>▼</button></span></li>';
  }).join("") + '</ol>';
}
function matchBody(q){
  if(!ui.temp[q.id]) ui.temp[q.id] = shuffle(range(q.choices.length));
  if(!ui.temp[q.id+"sel"]) ui.temp[q.id+"sel"] = q.rows.map(function(){ return ""; });
  var ord = ui.temp[q.id], sel = ui.temp[q.id+"sel"];
  return '<div class="mtable">' + q.rows.map(function(row, ri){
    return '<div class="mrow"><b id="mr' + ri + '">' + md(row) + '</b><select data-r="' + ri + '" aria-labelledby="mr' + ri + '"><option value="">Choose…</option>' +
      ord.map(function(ci){ return '<option value="' + ci + '"' + (String(sel[ri])===String(ci) ? " selected" : "") + '>' + esc(q.choices[ci]) + '</option>'; }).join("") +
      '</select></div>';
  }).join("") + '</div>';
}
function writeBody(z, q){
  var w = zrec(z).writing || { pick:"", text:"", checks:[] };
  return '<div class="opts" role="radiogroup" aria-label="Pick one prompt">' + q.choices.map(function(c, i){
      return '<label class="opt"><input type="radio" name="wp" value="' + i + '"' + (String(w.pick)===String(i) ? " checked" : "") + '><span>' + md(c) + '</span></label>';
    }).join("") + '</div>' +
    '<p style="margin:14px 0 4px"><strong>Sentence starter:</strong> ' + esc(q.starter) + '</p>' +
    '<p style="margin:8px 0 0"><strong>Word bank</strong> (use 3 or more):</p><div class="bank">' + q.bank.map(function(b){ return '<span>' + esc(b) + '</span>'; }).join("") + '</div>' +
    '<label class="sr" for="wt">Your explanation</label><textarea id="wt" placeholder="Write your explanation here.">' + esc(w.text) + '</textarea>' +
    '<div class="checks" style="margin-top:10px"><p style="margin:0 0 4px"><strong>Check your own writing:</strong></p>' +
    ['I used 3 or more science words.', 'I used "because" to explain WHY.', 'I gave an example or a step-by-step path.'].map(function(t, i){
      return '<label><input type="checkbox" data-ck="' + i + '"' + (w.checks && w.checks[i] ? " checked" : "") + '>' + esc(t) + '</label>';
    }).join("") + '</div>' +
    '<div class="qactions"><button class="btn primary" id="wsave">Save my writing</button><button class="btn quiet" id="wskip">Skip for now</button></div>';
}

/* ----- checking ----- */
function isOrderRight(q, o){
  var s = o.join(","); if(s === range(q.items.length).join(",")) return true;
  return (q.alt || []).some(function(a){ return a.join(",") === s; });
}
function near(a, b, tol){ return Math.abs(a - b) <= tol; }
function numTol(q){ return q.tol != null ? q.tol : Math.max(0.01, Math.abs(q.ans) * 0.005); }

function wire(z, q, r){
  var fb = document.getElementById("fb"), nxt = document.getElementById("nxt"), chk = document.getElementById("chk");
  nxt.onclick = function(){ advance(z); };
  if(q.type==="mc"){
    Array.prototype.forEach.call(document.querySelectorAll(".opt[data-o]"), function(b){
      b.onclick = function(){ judge(z, q, r, +b.getAttribute("data-o")); };
    });
  }
  if(q.type==="order"){
    var bindOrder = function(){
      Array.prototype.forEach.call(document.querySelectorAll("[data-up],[data-dn]"), function(b){
        b.onclick = function(){
          var o = ui.temp[q.id], up = b.hasAttribute("data-up"), k = +(b.getAttribute("data-up") || b.getAttribute("data-dn")), j = up ? k-1 : k+1;
          var t = o[k]; o[k] = o[j]; o[j] = t;
          document.getElementById("qb").innerHTML = orderBody(q); bindOrder();
          var nb = document.querySelector('[data-' + (up ? "up" : "dn") + '="' + j + '"]'); if(nb && !nb.disabled) nb.focus(); else { var alt = document.querySelector('[data-' + (up ? "dn" : "up") + '="' + j + '"]'); if(alt) alt.focus(); }
        };
      });
    };
    bindOrder();
  }
  if(q.type==="match"){
    Array.prototype.forEach.call(document.querySelectorAll("select[data-r]"), function(s){
      s.onchange = function(){ ui.temp[q.id+"sel"][+s.getAttribute("data-r")] = s.value; };
    });
  }
  if(q.type==="num"){
    var ni = document.getElementById("ni");
    ni.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); chk.click(); } });
  }
  if(chk) chk.onclick = function(){
    if(q.type==="multi"){
      var picks = Array.prototype.map.call(document.querySelectorAll('#qb input:checked'), function(x){ return +x.value; });
      if(!picks.length){ fb.innerHTML = '<div class="fb try"><p>Check at least one box.</p></div>'; return; }
      judge(z, q, r, picks);
    } else if(q.type==="num"){
      var raw = document.getElementById("ni").value.replace(/[,\s%]/g,"").replace(/[a-zA-Z°/]+$/,"");
      if(raw === "" || isNaN(+raw)){ fb.innerHTML = '<div class="fb try"><p>Type a number, like 250 or 12.5.</p></div>'; return; }
      judge(z, q, r, +raw);
    } else if(q.type==="order"){
      judge(z, q, r, ui.temp[q.id].slice());
    } else if(q.type==="match"){
      var sel = ui.temp[q.id+"sel"];
      if(sel.some(function(v){ return v===""; })){ fb.innerHTML = '<div class="fb try"><p>Choose an answer for every row.</p></div>'; return; }
      judge(z, q, r, sel.map(Number));
    }
  };
  if(q.type==="write"){
    var persist = function(){
      var pick = document.querySelector('input[name="wp"]:checked');
      zrec(z).writing = { pick: pick ? +pick.value : "", text: document.getElementById("wt").value,
        checks: Array.prototype.map.call(document.querySelectorAll("[data-ck]"), function(c){ return c.checked; }) };
    };
    document.getElementById("wsave").onclick = function(){
      persist(); var w = zrec(z).writing;
      if(w.pick === "" || w.text.trim().split(/\s+/).length < 8){ fb.innerHTML = '<div class="fb try"><p>Pick a prompt and write at least 2 sentences. Or choose Skip for now.</p></div>'; save(); return; }
      r.saved = true; touch(); save();
      fb.innerHTML = '<div class="fb ok"><p><strong>Saved.</strong> Your writing will be in your report so you can show Mr. Caves.</p></div>';
      nxt.hidden = false; nxt.textContent = "Finish this part →"; nxt.focus();
    };
    document.getElementById("wskip").onclick = function(){ persist(); r.saved = true; save(); advance(z); };
  }
}

function judge(z, q, r, val){
  if(r.result) return;
  touch();
  var fb = document.getElementById("fb"), nxt = document.getElementById("nxt"), chk = document.getElementById("chk");
  var correct = false, trapTags = [], partial = "";
  if(q.type==="mc"){
    correct = val === q.ans;
    if(!correct && q.traps && q.traps[val]) trapTags.push(q.traps[val]);
  } else if(q.type==="multi"){
    var a = q.ans.slice().sort().join(","), v = val.slice().sort().join(",");
    correct = a === v;
    if(!correct){
      if(q.traps) val.forEach(function(p){ if(q.traps[p] && trapTags.indexOf(q.traps[p])===-1) trapTags.push(q.traps[p]); });
      partial = "Some choices are wrong or missing.";
    }
  } else if(q.type==="num"){
    correct = near(val, q.ans, numTol(q));
    if(!correct && q.traps) q.traps.forEach(function(t){ if(near(val, t.v, t.tol != null ? t.tol : Math.max(0.01, Math.abs(t.v)*0.005))) trapTags.push(t.tag); });
  } else if(q.type==="order"){
    correct = isOrderRight(q, val);
    if(!correct){ var k = val.filter(function(x, i){ return x === i; }).length; partial = k + " of " + val.length + " steps are in the right spot."; }
  } else if(q.type==="match"){
    correct = val.every(function(x, i){ return x === q.ans[i]; });
    if(!correct){ var m = val.filter(function(x, i){ return x === q.ans[i]; }).length; partial = m + " of " + val.length + " matches are right."; }
  }
  r.tries++;
  if(correct){
    r.result = r.tries === 1 ? "first" : "second";
    var gain = r.tries === 1 ? 10 : 5, bonus = 0;
    if(r.tries === 1){ S.streak++; if(S.streak > S.best) S.best = S.streak; if(S.streak % 3 === 0){ bonus = 5; } } else S.streak = 0;
    S.points += gain + bonus; zrec(z).pts += gain + bonus;
    var cheer = r.tries === 1 ? ["Nice hunt!", "Sharp eyes!", "Right on target!", "Strong work!", "You nailed it!"][Math.floor(Math.random()*5)] : "Got it on the second try.";
    fb.innerHTML = '<div class="fb ok"><p><strong>✓ ' + cheer + '</strong> +' + gain + ' points.</p></div>';
    if(bonus) toast("ROAR! " + S.streak + " in a row. +5 bonus");
    lockInputs(q, val, true);
  } else {
    r.wrong.push(val);
    trapTags.forEach(function(t){ if(r.tags.indexOf(t)===-1) r.tags.push(t); });
    var trapMsg = trapTags.length ? "It looks like you " + TAGS[trapTags[0]].name.charAt(0).toLowerCase() + TAGS[trapTags[0]].name.slice(1) + "." : "";
    if(r.tries < maxTries(q)){
      var hint = q.hint || "Reread the Read box and try again.";
      fb.innerHTML = '<div class="fb try"><p><strong>Not quite.</strong> ' + esc(partial) + '</p>' + (trapMsg ? '<p>🔎 ' + esc(trapMsg) + '</p>' : "") + '<p>💡 ' + md(hint) + '</p><p class="small">One more try.</p></div>';
      if(q.type==="mc"){ var bb = document.querySelector('.opt[data-o="' + val + '"]'); if(bb){ bb.classList.add("wrong"); bb.disabled = true; } }
      S.streak = 0;
    } else {
      r.result = "missed"; S.streak = 0;
      var sk = SKILLS[q.skill];
      fb.innerHTML = '<div class="fb no"><p><strong>Not yet.</strong> ' + esc(partial) + ' This one goes on your review list.</p>' +
        (trapMsg ? '<p>🔎 ' + esc(trapMsg) + '</p>' : "") +
        '<p>📘 Practice it in your Review Guide: <strong>' + esc(sk.ref) + '</strong>.</p></div>';
      lockInputs(q, val, false);
    }
  }
  save();
  if(r.result){
    if(chk) chk.hidden = true;
    nxt.hidden = false;
    var last = ui.q >= z.questions.length - 1;
    nxt.textContent = last ? "Finish this part →" : "Next →";
    nxt.focus();
    refreshHud(z);
  }
}
function lockInputs(q, val, ok){
  Array.prototype.forEach.call(document.querySelectorAll("#qb button, #qb input, #qb select"), function(el){ el.disabled = true; });
  if(q.type==="mc" && ok){ var b = document.querySelector('.opt[data-o="' + val + '"]'); if(b) b.classList.add("right"); }
}
function refreshHud(z){
  var h = document.querySelector(".hud"); if(h) h.outerHTML = hud();
  var d = document.querySelector(".dots"); if(d){ var tmp = document.createElement("div"); tmp.innerHTML = zoneHead(z); d.innerHTML = tmp.querySelector(".dots").innerHTML; }
}
function advance(z){
  ui.q++;
  if(ui.q >= z.questions.length){ renderZoneSummary(z); return; }
  renderQuestion(z); window.scrollTo(0, 0);
}

function renderZoneSummary(z){
  ui.mode = "sum";
  var st = zoneStats(z), s = stars(st), rec = zrec(z);
  var good = [], work = [];
  var bySkill = {};
  scorable(z).forEach(function(q){ var r = rec.q[q.id]; if(!r || !r.result) return; (bySkill[q.skill] = bySkill[q.skill] || []).push(r.result); });
  Object.keys(bySkill).forEach(function(k){ var a = bySkill[k]; if(a.every(function(x){ return x==="first"; })) good.push(SKILLS[k].label); else work.push(SKILLS[k].label); });
  var idx = ZONES.indexOf(z), nextI = -1;
  for(var k=1; k<=ZONES.length; k++){ var c = (idx + k) % ZONES.length; if(!zoneStats(ZONES[c]).done){ nextI = c; break; } }
  var msg = s===3 ? "Fierce! You own this part." : s===2 ? "Solid hunt. A few skills need practice." : "Good effort. This part needs more practice.";
  app.innerHTML = hud() + '<main class="wrap">' + zoneHead(z) +
    '<section class="qcard summary"><div class="stars" aria-label="' + s + ' of 3 stars">' + "★".repeat(s) + "☆".repeat(3-s) + '</div>' +
    '<h3>Part ' + z.part + ' done</h3><p>' + msg + '</p>' +
    '<p><strong>' + st.first + '</strong> first try · <strong>' + st.second + '</strong> second try · <strong>' + st.missed + '</strong> not yet</p>' +
    (good.length ? '<div><h4 style="margin:14px 0 0">✅ You can:</h4><ul>' + good.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join("") + '</ul></div>' : "") +
    (work.length ? '<div><h4 style="margin:6px 0 0">📘 Practice more:</h4><ul>' + work.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join("") + '</ul></div>' : "") +
    '<div class="qactions" style="justify-content:center">' +
    '<button class="btn quiet" id="again">Redo this part</button>' +
    '<button class="btn" id="bk">Back to map</button>' +
    (nextI >= 0 ? '<button class="btn primary" id="nx">Next: Part ' + ZONES[nextI].part + ' →</button>' : '<button class="btn primary" id="rp">See my report →</button>') +
    '</div></section></main>';
  bindMap();
  document.getElementById("bk").onclick = function(){ renderMap(); };
  document.getElementById("again").onclick = function(){
    askConfirm("Redo Part " + z.part + "? Your answers and points for this part will reset. Your report will show the new try.", "Yes, redo it", function(){
    S.points = Math.max(0, S.points - rec.pts);
    var keepW = rec.writing, conf = rec.conf;
    S.zones[z.id] = { conf:conf, q:{}, pts:0, writing:keepW, redo:(rec.redo||0)+1 };
    save(); openZone(idx);
    });
  };
  if(nextI >= 0) document.getElementById("nx").onclick = function(){ openZone(nextI); window.scrollTo(0,0); };
  else document.getElementById("rp").onclick = function(){ renderReport(); };
  document.getElementById(nextI >= 0 ? "nx" : "rp").focus();
}

/* ---------- REPORT ---------- */
function buildReport(){
  var R = { zones:[], skills:{}, tags:{}, totals:{first:0,second:0,missed:0,answered:0,total:0} };
  ZONES.forEach(function(z){
    var st = zoneStats(z), rec = zrec(z);
    R.zones.push({ z:z, st:st, conf:rec.conf, redo:rec.redo||0 });
    R.totals.first += st.first; R.totals.second += st.second; R.totals.missed += st.missed; R.totals.answered += st.answered; R.totals.total += st.total;
    scorable(z).forEach(function(q){
      var r = rec.q[q.id]; if(!r || !r.result) return;
      var k = R.skills[q.skill] = R.skills[q.skill] || { id:q.skill, n:0, first:0, second:0, missed:0, items:[] };
      k.n++; k[r.result]++; k.items.push({ q:q, r:r, z:z });
      (r.tags || []).forEach(function(t){ var T = R.tags[t] = R.tags[t] || { n:0, where:[] }; T.n++; T.where.push("Part " + z.part + ": " + q.short); });
    });
  });
  return R;
}
function skillStatus(k){ if(k.missed) return "review"; if(k.second) return "almost"; return "strong"; }

function renderReport(){
  touch(); save();
  var R = buildReport(), T = R.totals;
  var acc = T.answered ? Math.round(100 * T.first / T.answered) : 0;
  var mins = Math.max(1, Math.round(S.activeMs / 60000));
  var date = new Date().toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });
  var done = R.zones.filter(function(x){ return x.st.done; }).length;

  // Parts table
  var rows = R.zones.map(function(x){
    var st = x.st, z = x.z, has = st.answered > 0;

  var almostHTML = almost.length ? almost.map(function(k){ return itemHTML(k, "almost"); }).join("") : "";

  var tagHTML = tagKeys.length ? tagKeys.map(function(t){

        '<p class="small">Where: ' + esc(x.where.join("; ")) + '</p><p>✅ <strong>Fix:</strong> ' + esc(TAGS[t].fix) + '</p></div>';

    else if(x.conf === 1 && sc >= .85) confNotes.push('<li><strong>Part ' + z.part + ' (' + esc(z.title) + '):</strong> You felt "Not yet" but scored ' + Math.round(sc*100) + '%. You know more than you think!</li>');
    else if(x.conf === 1 && sc < .6) confNotes.push('<li><strong>Part ' + z.part + ' (' + esc(z.title) + '):</strong> You knew this was hard, and you were right. Start your studying here.</li>');
  });

function groupByPart(list, fn){
  var parts = {}; list.forEach(function(k){ var p = SKILLS[k.id].part; (parts[p] = parts[p] || []).push(k); });
  return Object.keys(parts).sort(function(a,b){ return a-b; }).map(function(p){
    var z = ZONES[p-1];
    return '<h4>Part ' + p + ': ' + esc(z.title) + '</h4><ul style="margin:0">' + parts[p].map(fn).join("") + '</ul>';
  }).join("");
}
function studyPlan(R){
  var need = R.zones.filter(function(x){ return x.st.answered && x.st.score < .85; }).sort(function(a,b){ return a.st.score - b.st.score; });
  var unf = R.zones.filter(function(x){ return !x.st.done; });
  var days = [], d = 1;
  function partRefs(z){
    var refs = [];
    Object.keys(R.skills).forEach(function(k){ var s = R.skills[k]; if(SKILLS[k].part === z.part && skillStatus(s) !== "strong" && refs.indexOf(SKILLS[k].ref) === -1) refs.push(SKILLS[k].ref); });
    return refs;
  }
  if(unf.length) days.push('<li><strong>Day ' + (d++) + ':</strong> Finish the game parts you skipped: ' + esc(unf.map(function(x){ return "Part " + x.z.part; }).join(", ")) + '. Then open this report again.</li>');
  for(var i=0; i<need.length; i+=2){
    var pair = need.slice(i, i+2);
    var txt = pair.map(function(x){
      var refs = partRefs(x.z);
      return '<strong>Part ' + x.z.part + ' (' + esc(x.z.title) + ')</strong>: reread your notes for this part. Then redo Review Guide ' + esc(refs.length ? refs.join("; ") : "Part " + x.z.part) + '. Check with the answer key.';
    }).join(" Then ");
    days.push('<li><strong>Day ' + (d++) + ':</strong> ' + txt + '</li>');
  }
  if(need.length) days.push('<li><strong>Day ' + (d++) + ':</strong> Redo the game parts above with "Redo this part." Aim for 3 stars. Quiz a partner with the Self-Check on the review page.</li>');
  days.push('<li><strong>' + (need.length || unf.length ? "Day " + (d++) : "Day 1") + ':</strong> Do Review Guide Part 10. Practice explaining one idea out loud in full sentences. That is practice for the bonus.</li>');
  days.push('<li><strong>Night before:</strong> Look over your notes one more time. Pack a calculator, pencil, and eraser. Get a good night\u2019s sleep.</li>');
  var top = need.length ? '<p>Start with <strong>Part ' + need[0].z.part + '</strong>. It was your hardest part.</p>' : '<p>All the parts you finished are strong. Keep them fresh.</p>';
  return top + '<ol>' + days.join("") + '</ol>';
}
function reportText(R, acc, mins, date){
  var L = [];
  L.push("PRIDE QUEST REPORT: Lions Review");
  L.push(S.name + " | Block " + S.hour + " | " + date);
  L.push("Points: " + S.points + " | Rank: " + rank() + " | First-try accuracy: " + acc + "% | Best streak: " + S.best + " | Time: " + mins + " min");
  L.push("");
  L.push("PART BY PART");
  R.zones.forEach(function(x){
    var st = x.st, has = st.answered > 0;
    L.push("Part " + x.z.part + " " + x.z.title + ": " + (has ? st.first + "/" + st.total + " first try, " + Math.round(st.score*100) + "%, " + STATUS_TXT[status(st.score)] + (st.done ? "" : " (not finished)") : "Not started") + (x.conf ? " | felt: " + ["", "Not yet", "Getting there", "Got it"][x.conf] : ""));
  });
  var list = Object.keys(R.skills).map(function(k){ return R.skills[k]; }).sort(function(a,b){ return SKILLS[a.id].part - SKILLS[b.id].part; });
  L.push(""); L.push("WHAT I DID WELL");
  list.filter(function(k){ return skillStatus(k)==="strong"; }).forEach(function(k){ L.push("- I can " + SKILLS[k.id].label + " (Part " + SKILLS[k.id].part + ")"); });
  ["review","almost"].forEach(function(s){
    L.push(""); L.push(s==="review" ? "REVIEW FIRST" : "ALMOST THERE (2nd try)");
    list.filter(function(k){ return skillStatus(k)===s; }).forEach(function(k){
      var sk = SKILLS[k.id];
      L.push("- Part " + sk.part + ": " + sk.label + " | Guide: " + sk.ref);
      L.push("  Tip: " + sk.tip);
    });
  });
  var tk = Object.keys(R.tags);
  if(tk.length){ L.push(""); L.push("MISTAKE PATTERNS"); tk.forEach(function(t){ L.push("- " + TAGS[t].name + " (" + R.tags[t].n + "x). Fix: " + TAGS[t].fix); }); }
  var w = zrec(ZONES[9]).writing;
  if(w && w.text && w.text.trim()){ L.push(""); L.push("BONUS WRITING"); if(w.pick !== "") L.push("Prompt: " + ZONES[9].questions[4].choices[w.pick]); L.push(w.text.trim()); }
  return L.join("\n");
}

      '<line x1="10" y1="39" x2="40" y2="39" stroke="var(--dusk)" stroke-width="3.5" stroke-dasharray="7 4"/><text x="48" y="44" font-size="13" fill="var(--ink)">Reaction Q (dashed)</text></g>';
    return '<svg viewBox="0 0 560 320" role="img" aria-label="Energy graph with two hill-shaped lines, Reaction P solid and Reaction Q dashed. Energy axis from 0 to 100 with a gridline every 10. Both start at the reactants on the left and end at the products on the right. Read the graph to find each value.">' + s + '</svg>';
  },
  enzymeDiagram: function(){
    function enzyme(cx){ return '<path d="M'+(cx-70)+' 150 Q'+(cx-82)+' 92 '+(cx-50)+' 82 L'+(cx-25)+' 82 L'+(cx-15)+' 102 L'+(cx+15)+' 102 L'+(cx+25)+' 82 L'+(cx+50)+' 82 Q'+(cx+82)+' 92 '+(cx+70)+' 150 Q'+cx+' 192 '+(cx-70)+' 150Z" fill="var(--acacia-soft)" stroke="var(--acacia)" stroke-width="2.5"/>'; }
    function subL(cx,y,dx){ dx=dx||0; return '<polygon points="'+(cx-24+dx)+','+(y-16)+' '+(cx+dx)+','+(y-16)+' '+(cx+dx)+','+(y+20)+' '+(cx-14+dx)+','+(y+20)+' '+(cx-24+dx)+','+y+'" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.5"/>'; }
    function subR(cx,y,dx){ dx=dx||0; return '<polygon points="'+(cx+dx)+','+(y-16)+' '+(cx+24+dx)+','+(y-16)+' '+(cx+24+dx)+','+y+' '+(cx+14+dx)+','+(y+20)+' '+(cx+dx)+','+(y+20)+'" fill="var(--sky2)" stroke="var(--ink)" stroke-width="1.5"/>'; }
    function tag(x,y,l){ return '<circle cx="'+x+'" cy="'+y+'" r="14" fill="var(--ink)"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--surface)">'+l+'</text>'; }
    function lead(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--ink)" stroke-width="1.5"/>'; }
    var s='';
    s+=enzyme(110) + subL(110,32) + subR(110,32);
    s+=lead(150,30,136,30) + tag(164,30,"V");
    s+=lead(60,160,40,175) + tag(30,182,"W");
    s+=lead(110,100,70,60) + tag(58,52,"X");
    s+='<path d="M195 120 L235 120" stroke="var(--ink)" stroke-width="3" marker-end="url(#ea)"/>';
    s+=enzyme(320) + subL(320,82) + subR(320,82);
    s+='<rect x="240" y="58" width="160" height="140" rx="16" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 5"/>' + tag(400,58,"Y");
    s+='<path d="M408 120 L448 120" stroke="var(--ink)" stroke-width="3" marker-end="url(#ea)"/>';
    s+=enzyme(540) + subL(512,30,-6) + subR(568,30,6);
    s+=lead(520,52,540,62) + lead(570,52,550,62) + tag(545,72,"Z");
    return '<svg viewBox="0 0 640 210" role="img" aria-label="Enzyme diagram in three steps with letters V, W, X, Y, and Z. Step 1: a two-piece molecule labeled V floats above a larger shape labeled W, which has a pocket labeled X. Step 2: the two-piece molecule sits inside the pocket, and the whole thing is labeled Y. Step 3: the two pieces have split apart and move away, labeled Z, and the larger shape is left unchanged.">' +
      '<defs><marker id="ea" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>' + s + '</svg>';
  },
  tempGraph: function(){
    var x0=60, x1=520, y0=270, y1=30;
    function X(v){ return x0 + (v-20)/(90-20)*(x1-x0); }
    function Y(v){ return y0 - v/10*(y0-y1); }
    var t=[20,30,40,50,60,70,80,90], r=[1,2,3.5,5,7,9,4,0.5], s='';
    for(var v=0; v<=10; v++){ s+='<line x1="'+x0+'" y1="'+Y(v)+'" x2="'+x1+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="'+(v%2===0?1.3:.6)+'"/>'; if(v%2===0) s+='<text x="'+(x0-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" '+AX+'>'+v+'</text>'; }
    t.forEach(function(v){ s+='<line x1="'+X(v)+'" y1="'+y0+'" x2="'+X(v)+'" y2="'+y1+'" stroke="var(--line)" stroke-width=".6"/><text x="'+X(v)+'" y="'+(y0+20)+'" text-anchor="middle" '+AX+'>'+v+'</text>'; });
    s+='<polyline points="'+t.map(function(v,i){ return X(v)+','+Y(r[i]); }).join(" ")+'" fill="none" stroke="var(--warn)" stroke-width="3.5" stroke-linejoin="round"/>';
    t.forEach(function(v,i){ s+='<circle cx="'+X(v)+'" cy="'+Y(r[i])+'" r="5.5" fill="var(--warn)"/>'; });
    s+='<text x="'+((x0+x1)/2)+'" y="'+(y0+42)+'" text-anchor="middle" '+AX+' font-weight="700">Temperature (°C)</text>';
    s+='<text transform="translate(18 '+((y0+y1)/2)+') rotate(-90)" text-anchor="middle" '+AX+' font-weight="700">Rate of reaction</text>';
    return '<svg viewBox="0 0 560 320" role="img" aria-label="Line graph of rate of reaction from 20 to 90 degrees Celsius. The line rises slowly, peaks, then drops quickly. Read the graph to find the peak.">' + s + '</svg>';
  },
  nitroDiagram: function(){
    function box(cx,cy,w,h,t1,t2,c){ return '<rect x="'+(cx-w/2)+'" y="'+(cy-h/2)+'" width="'+w+'" height="'+h+'" rx="12" fill="'+c+'" stroke="var(--ink)" stroke-width="1.5"/>' +
      '<text x="'+cx+'" y="'+(cy+(t2?-3:5))+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+t1+'</text>' + (t2 ? '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="13" fill="var(--ink)">'+t2+'</text>' : ""); }
    function arr(x1,y1,x2,y2,n){ var mx=(x1+x2)/2, my=(y1+y2)/2; return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--ink)" stroke-width="3" marker-end="url(#na)"/>' +
      '<circle cx="'+mx+'" cy="'+my+'" r="13" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.5"/><text x="'+mx+'" y="'+(my+5)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#1d1406">'+n+'</text>'; }
    var s='';
    s+=box(320,42,240,46,"Nitrogen gas (N₂)","in the air","var(--surface2)");
    s+=box(110,200,180,56,"Ammonium (NH₄⁺)","in soil","var(--gold-soft)");
    s+=box(335,215,160,56,"Nitrate (NO₃⁻)","in soil","var(--gold-soft)");
    s+=box(550,125,140,46,"🌿 Plants","","var(--acacia-soft)");
    s+=box(550,300,140,46,"🦓 Animals","","var(--acacia-soft)");
    s+=box(300,345,220,44,"Dead things and waste","","var(--surface2)");
    s+=arr(220,62,130,166,1);
    s+=arr(202,205,250,210,2);
    s+=arr(415,200,478,140,3);
    s+=arr(550,150,550,272,4);
    s+=arr(478,312,412,336,5);
    s+=arr(190,335,115,232,6);
    s+=arr(385,186,385,70,7);
    return '<svg viewBox="0 0 640 380" role="img" aria-label="Nitrogen cycle diagram with 6 boxes and 7 numbered arrows. Boxes: nitrogen gas in the air, ammonium in soil, nitrate in soil, plants, animals, and dead things and waste. Arrow 1 goes from the air to ammonium. Arrow 2 goes from ammonium to nitrate. Arrow 3 goes from nitrate to plants. Arrow 4 goes from plants to animals. Arrow 5 goes from animals to dead things and waste. Arrow 6 goes from dead things and waste to ammonium. Arrow 7 goes from nitrate to the air.">' +
      '<defs><marker id="na" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>' + s + '</svg>';
  }
};

/* ---------- boot ---------- */
S = null;
renderStart();
})();
